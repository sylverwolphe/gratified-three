<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gratified — Ops</title>
<link href="https://api.fontshare.com/v2/css?f[]=Satoshi@1,2&display=swap" rel="stylesheet">
<style>
/* ═══════════════════ TOKENS ═══════════════════ */
:root {
  --bg:         #FAF9F6;
  --surface:    #FFFFFF;
  --border:     #E7E2D8;
  --border-2:   #D9D2C3;
  --ink:        #24211D;
  --ink-soft:   #635C4D;
  --ink-dim:    #9C947F;
  --accent:     #722F37;
  --accent-soft:rgba(114,47,55,.07);
  --hi:         #C4501E;
  --med:        #B8792E;
  --lo:         #8C826A;
  --done-col:   #A79E8C;
  --radius:     5px;
  --font:       'Satoshi', system-ui, -apple-system, sans-serif;
}

/* ═══════════════════ RESET ═══════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
button, input, select, textarea { font-family:inherit; }

body {
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  font-size:13px;
  -webkit-font-smoothing:antialiased;
}
::selection { background:var(--accent-soft); }
:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }

/* ═══════════════════ HEADER ═══════════════════ */
.header {
  position:sticky; top:0; z-index:200;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:0 16px;
  height:50px;
  display:flex; align-items:center; gap:14px;
}
.brand { display:flex; align-items:baseline; gap:6px; flex-shrink:0; }
.brand-mark {
  width:9px; height:9px; background:var(--accent);
  transform:rotate(45deg); flex-shrink:0;
}
.brand-name { font-size:14px; font-weight:700; letter-spacing:-.2px; color:var(--ink); }
.brand-sub  { font-size:11px; color:var(--ink-dim); }

.hcontrols { display:flex; gap:6px; align-items:center; flex:1; min-width:0; }
.ctrl {
  padding:5px 9px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--surface);
  font-size:12px; color:var(--ink);
  outline:none; transition:border-color .15s;
  height:28px;
}
.ctrl:focus { border-color:var(--accent); }
.ctrl::placeholder { color:var(--ink-dim); }
input.ctrl  { width:180px; max-width:40vw; }
select.ctrl { cursor:pointer; color:var(--ink-soft); }
.search-wrap { position:relative; display:flex; align-items:center; }

.hstats {
  margin-left:auto; flex-shrink:0;
  font-size:11.5px; color:var(--ink-dim);
  white-space:nowrap; letter-spacing:.1px;
}
.hstats strong { color:var(--ink-soft); font-weight:700; }
.hstats .warn { color:var(--hi); font-weight:700; }

.lockbtn {
  flex-shrink:0; padding:4px 9px; font-size:11px; font-weight:600;
  border:1px solid var(--border); border-radius:var(--radius);
  background:var(--surface); color:var(--ink-soft); cursor:pointer;
  transition:all .12s;
}
.lockbtn:hover { border-color:var(--ink-soft); color:var(--ink); }

/* ═══════════════════ PROJECT BAR ═══════════════════ */
.projbar {
  display:flex; align-items:center; gap:6px;
  padding:7px 14px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  background:var(--bg); border-bottom:1px solid var(--border);
  position:sticky; top:50px; z-index:196;
  scrollbar-width:none;
}
.projbar::-webkit-scrollbar { display:none; }
.proj-pill {
  flex-shrink:0; display:flex; align-items:center; gap:6px;
  padding:5px 10px;
  border:1px solid var(--border); border-radius:6px;
  background:var(--surface);
  font-size:12.5px; font-weight:600; color:var(--ink-soft);
  cursor:pointer; white-space:nowrap; transition:background .15s,border-color .15s,color .15s;
}
.proj-pill:hover { border-color:var(--border-2); }
.proj-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.proj-count { font-size:10.5px; font-weight:600; opacity:.6; font-variant-numeric:tabular-nums; }
.proj-pill.active .proj-count { opacity:.85; }
.proj-more {
  background:none; border:none; cursor:pointer; color:var(--ink-dim);
  font-size:14px; line-height:1; padding:0 0 0 2px; opacity:.7;
}
.proj-more:hover { opacity:1; }
.proj-rename {
  border:none; outline:none; background:transparent;
  font-family:var(--font); font-size:12.5px; font-weight:600; width:150px;
}
.proj-pill.archived { opacity:.55; border-style:dashed; }
.proj-pill.pdrag { opacity:.35; }
.proj-pill.pdrop { box-shadow:inset 3px 0 0 var(--accent); }
.proj-add {
  flex-shrink:0; width:27px; height:27px;
  border:1px dashed var(--border-2); border-radius:6px;
  background:transparent; color:var(--ink-dim);
  font-size:16px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .12s;
}
.proj-add:hover { border-color:var(--accent); color:var(--accent); }
.proj-arch-toggle {
  flex-shrink:0; padding:5px 10px;
  border:1px solid var(--border); border-radius:6px;
  background:transparent; color:var(--ink-dim);
  font-size:11.5px; font-weight:600; cursor:pointer; transition:all .12s;
}
.proj-arch-toggle:hover { border-color:var(--border-2); color:var(--ink-soft); }

/* ═══════════════════ MOBILE TABS ═══════════════════ */
.tabbar {
  display:none;
  gap:6px; padding:8px 12px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  position:sticky; top:91px; z-index:190;
  scrollbar-width:none;
}
.tabbar::-webkit-scrollbar { display:none; }
.tab-pill {
  flex-shrink:0;
  padding:5px 11px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface);
  font-size:12px; font-weight:600; color:var(--ink-soft);
  cursor:pointer; white-space:nowrap;
  display:flex; align-items:center; gap:5px;
  transition:all .15s;
}
.tab-pill .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.tab-pill.active {
  background:var(--ink); border-color:var(--ink); color:#fff;
}
.tab-pill .n { opacity:.65; font-weight:500; }

/* ═══════════════════ BOARD ═══════════════════ */
.board {
  display:grid;
  grid-template-columns:repeat(6, minmax(150px,1fr));
  gap:1px;
  background:var(--border);
  border-top:1px solid var(--border);
}

.col {
  display:flex; flex-direction:column;
  background:var(--bg);
  max-height:calc(100vh - 92px);
  min-width:0;
}

.col-header {
  padding:10px 12px 8px;
  display:flex; align-items:center; gap:7px;
  flex-shrink:0;
}
.col-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.col-title {
  font-size:11.5px; font-weight:700; letter-spacing:.3px;
  color:var(--ink-soft);
  flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.col-count { font-size:11px; color:var(--ink-dim); font-variant-numeric:tabular-nums; }

.quick-add-row { padding:0 8px 8px; flex-shrink:0; }
.quick-add {
  width:100%; padding:5px 8px;
  background:transparent;
  border:1px dashed var(--border-2);
  border-radius:var(--radius);
  font-family:var(--font);
  font-size:12px; color:var(--ink);
  outline:none;
  transition:border-color .15s, background .15s, border-style .15s;
}
.quick-add::placeholder { color:var(--ink-dim); }
.quick-add:focus {
  border-color:var(--accent); border-style:solid;
  background:var(--surface);
}

.col-body {
  flex:1; overflow-y:auto;
  padding:0 8px 10px; display:flex; flex-direction:column; gap:6px;
  scrollbar-width:thin; scrollbar-color:var(--border-2) transparent;
}
.col.drop-target .col-body { background:var(--accent-soft); }

.col-empty {
  font-size:11.5px; color:var(--ink-dim);
  text-align:center; padding:16px 6px; opacity:.6;
}

/* ═══════════════════ TASK CARD ═══════════════════ */
.task {
  background:var(--surface);
  border:1px solid var(--border);
  border-left:3px solid var(--pri-color, var(--border));
  border-radius:var(--radius);
  padding:8px 9px 7px;
  position:relative;
  transition:border-color .15s, box-shadow .15s;
}
.task:hover { border-color:var(--border-2); box-shadow:0 1px 3px rgba(36,33,29,.06); }
.task.dragging { opacity:.35; }
.task.done .task-main-title { text-decoration:line-through; color:var(--ink-dim); }
.task.done { border-left-color:var(--done-col); }
.task.sub-target { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }

.task-top { display:flex; align-items:flex-start; gap:6px; }
.task-main { flex:1; min-width:0; cursor:pointer; }
.task-main-title {
  font-size:12.5px; font-weight:600; line-height:1.4;
  color:var(--ink); word-break:break-word;
}
.task-count-badge { font-size:10.5px; color:var(--ink-dim); font-weight:500; margin-left:4px; }
.task-desc {
  font-size:11px; color:var(--ink-dim);
  line-height:1.4; margin-top:2px;
  overflow:hidden; display:-webkit-box;
  -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.task-del {
  flex-shrink:0; width:16px; height:16px;
  display:flex; align-items:center; justify-content:center;
  background:none; border:none; cursor:pointer;
  color:var(--ink-dim); font-size:15px; line-height:1;
  opacity:0; transition:opacity .12s, color .12s;
  border-radius:3px;
}
.task:hover .task-del { opacity:.6; }
.task-del:hover { opacity:1 !important; color:var(--hi); background:var(--accent-soft); }

.task-footer {
  display:flex; align-items:center; flex-wrap:wrap; gap:5px;
  margin-top:6px;
}
.task-due {
  font-size:10.5px; color:var(--ink-dim); font-weight:500;
}
.task-due.overdue { color:var(--hi); font-weight:700; }
.task-label {
  font-size:10px; font-weight:600; letter-spacing:.2px;
  padding:1px 6px; border-radius:8px;
  background:var(--accent-soft); color:var(--accent);
}
.task-move { margin-left:auto; display:flex; gap:2px; opacity:0; transition:opacity .12s; }
.task:hover .task-move, .col-body:active .task-move { opacity:1; }
.mv-btn {
  width:17px; height:17px; border:1px solid var(--border);
  border-radius:3px; background:var(--surface);
  color:var(--ink-dim); font-size:10px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .12s;
}
.mv-btn:hover { border-color:var(--accent); color:var(--accent); }
.mv-btn:disabled { opacity:.25; cursor:default; }
.mv-btn:disabled:hover { border-color:var(--border); color:var(--ink-dim); }

/* Subtasks — nested inline on card */
.subs { margin-top:6px; padding-left:9px; border-left:2px solid var(--border); display:flex; flex-direction:column; gap:1px; }
.sub-row { display:flex; align-items:center; gap:5px; padding:2px 0; }
.sub-check { width:11px; height:11px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
.sub-text {
  flex:1; border:none; outline:none; background:transparent;
  font-family:var(--font); font-size:11px; color:var(--ink-soft);
  padding:1px 2px; min-width:0;
}
.sub-row.done .sub-text { text-decoration:line-through; color:var(--ink-dim); }
.sub-x {
  background:none; border:none; cursor:pointer; color:var(--ink-dim);
  font-size:12px; opacity:0; transition:opacity .12s; flex-shrink:0; line-height:1;
}
.sub-row:hover .sub-x { opacity:.7; }
.sub-x:hover { opacity:1 !important; color:var(--hi); }
.sub-more {
  font-size:10.5px; color:var(--ink-dim); background:none; border:none;
  cursor:pointer; text-align:left; padding:2px 0; font-weight:600;
}
.sub-more:hover { color:var(--accent); }
.sub-add {
  width:100%; border:none; outline:none; background:transparent;
  font-family:var(--font); font-size:11px; color:var(--ink-dim);
  padding:2px 2px 0; margin-top:1px;
}
.sub-add:focus { color:var(--ink); }
.sub-add::placeholder { color:var(--ink-dim); opacity:.7; }

/* ═══════════════════ BUTTONS ═══════════════════ */
.btn {
  padding:6px 13px; font-size:12px; font-weight:700;
  letter-spacing:.2px; cursor:pointer; border:none; border-radius:var(--radius);
  transition:all .15s;
}
.btn-primary { background:var(--ink); color:#fff; }
.btn-primary:hover { background:var(--accent); }
.btn-ghost { background:transparent; color:var(--ink-soft); border:1px solid var(--border-2); }
.btn-ghost:hover { border-color:var(--ink-soft); color:var(--ink); }
.btn-ghost:disabled { opacity:.4; cursor:default; }
.btn-ghost:disabled:hover { border-color:var(--border-2); color:var(--ink-soft); }
.btn-danger { background:transparent; color:var(--hi); border:1px solid var(--hi); }
.btn-danger:hover { background:var(--hi); color:#fff; }

/* ═══════════════════ MODAL ═══════════════════ */
.backdrop {
  position:fixed; inset:0; z-index:500;
  background:rgba(36,33,29,.4);
  display:flex; align-items:center; justify-content:center;
  padding:16px; backdrop-filter:blur(1.5px);
}
.modal {
  background:var(--surface);
  border:1px solid var(--border-2);
  border-radius:8px;
  width:100%; max-width:520px; max-height:88vh;
  overflow-y:auto;
  box-shadow:0 12px 40px rgba(36,33,29,.18);
  animation:modalIn .15s ease;
}
@keyframes modalIn { from{opacity:0;transform:translateY(6px) scale(.99)} to{opacity:1;transform:translateY(0) scale(1)} }

.modal-head {
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; background:var(--surface); z-index:10;
}
.modal-eyebrow {
  font-size:10.5px; font-weight:700; color:var(--ink-dim);
  letter-spacing:1px; text-transform:uppercase;
  display:flex; align-items:center; gap:6px;
}
.modal-close {
  background:none; border:none; cursor:pointer;
  color:var(--ink-dim); font-size:19px; line-height:1;
  padding:2px 5px; border-radius:4px; transition:all .12s;
}
.modal-close:hover { color:var(--ink); background:var(--bg); }

.modal-body { padding:16px; display:flex; flex-direction:column; gap:14px; }
.modal-foot {
  padding:11px 16px;
  border-top:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center;
  position:sticky; bottom:0; background:var(--surface); z-index:10;
}

.f-label {
  font-size:10.5px; font-weight:700; color:var(--ink-dim);
  letter-spacing:.8px; text-transform:uppercase; margin-bottom:5px;
}
.f-hint { font-weight:500; text-transform:none; letter-spacing:0; opacity:.75; }
.f-input {
  width:100%; padding:7px 9px;
  border:1px solid var(--border-2);
  border-radius:var(--radius);
  background:var(--surface); font-size:13px;
  color:var(--ink); outline:none;
  transition:border-color .15s;
}
.f-input:focus { border-color:var(--accent); }
.f-title { font-size:15px; font-weight:700; }
.f-desc  { min-height:68px; resize:vertical; font-size:12.5px; line-height:1.55; }
.f-row   { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.pri-group { display:flex; gap:5px; }
.pri-btn {
  flex:1; padding:6px 4px; font-size:11px; font-weight:700;
  border:1px solid var(--border-2); border-radius:var(--radius);
  background:transparent; color:var(--ink-soft);
  cursor:pointer; text-align:center; transition:all .15s;
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.pri-btn .d { width:6px; height:6px; border-radius:50%; }
.pri-btn.on { color:#fff; }
.pri-btn.on[data-p="high"]   { background:var(--hi); border-color:var(--hi); }
.pri-btn.on[data-p="medium"] { background:var(--med); border-color:var(--med); }
.pri-btn.on[data-p="low"]    { background:var(--lo); border-color:var(--lo); }
.pri-btn.on .d { background:#fff; }

.label-group { display:flex; flex-wrap:wrap; gap:5px; }
.lbl-btn {
  padding:3px 10px; font-size:11px; font-weight:600;
  border:1px solid var(--border-2); border-radius:12px;
  background:transparent; color:var(--ink-dim); cursor:pointer;
  transition:all .12s;
}
.lbl-btn.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

.meta-text { font-size:10.5px; color:var(--ink-dim); }

.sub-list { display:flex; flex-direction:column; margin-bottom:4px; }
.mrow { display:flex; align-items:center; gap:7px; padding:4px 0; border-bottom:1px solid var(--border); }
.mcheck { cursor:pointer; accent-color:var(--accent); width:13px; height:13px; flex-shrink:0; }
.mtitle {
  flex:1; border:none; outline:none;
  font-family:var(--font); font-size:12.5px; color:var(--ink);
  background:transparent; padding:1px 2px;
}
.mrow.done .mtitle { text-decoration:line-through; color:var(--ink-dim); }
.mdel {
  background:none; border:none; cursor:pointer;
  color:var(--ink-dim); font-size:14px; padding:0 2px; line-height:1;
  opacity:0; transition:opacity .1s;
}
.mrow:hover .mdel { opacity:1; }
.mdel:hover { color:var(--hi); }
.add-sub-btn {
  background:none; border:none; cursor:pointer;
  color:var(--ink-dim); font-size:11.5px; font-weight:600;
  padding:4px 0; transition:color .12s;
}
.add-sub-btn:hover { color:var(--accent); }

/* Colour swatches (project settings) */
.swatch-row { display:flex; flex-wrap:wrap; gap:9px; }
.swatch {
  width:30px; height:30px; border-radius:50%;
  border:none; cursor:pointer;
  box-shadow:0 0 0 1px var(--border-2);
  transition:transform .1s, box-shadow .12s;
}
.swatch:hover { transform:scale(1.08); }
.swatch.on { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }

/* ═══════════════════ GATE ═══════════════════ */
.gate {
  position:fixed; inset:0; z-index:900;
  background:var(--bg);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.gate-card {
  width:100%; max-width:320px; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:12px;
}
.gate-brand { display:flex; align-items:center; gap:8px; }
.gate-brand .brand-mark { width:11px; height:11px; }
.gate-brand span { font-size:19px; font-weight:700; letter-spacing:-.3px; }
.gate-sub { font-size:12.5px; color:var(--ink-dim); margin-bottom:4px; }
.gate-input {
  width:100%; padding:9px 11px;
  border:1px solid var(--border-2); border-radius:var(--radius);
  font-size:14px; text-align:center; letter-spacing:1px;
  background:var(--surface); color:var(--ink); outline:none;
  transition:border-color .15s;
}
.gate-input:focus { border-color:var(--accent); }
.gate-input.err { border-color:var(--hi); animation:shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.gate-btn { width:100%; padding:9px; }
.gate-err { font-size:11.5px; color:var(--hi); min-height:14px; font-weight:600; }
.gate-note { font-size:10.5px; color:var(--ink-dim); margin-top:2px; }

/* ═══════════════════ SCHEDULE ═══════════════════ */
.calsec { background:var(--bg); border-bottom:1px solid var(--border); }
.cal-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:7px; padding:8px 14px 7px; }
.cal-collapse {
  width:20px; height:20px; padding:0; border:none; background:none; cursor:pointer;
  color:var(--ink-dim); font-size:11px; line-height:1;
  transition:transform .15s, color .12s;
}
.cal-collapse:hover { color:var(--ink); }
.calsec.collapsed .cal-collapse { transform:rotate(-90deg); }
.cal-title { font-size:13px; font-weight:700; letter-spacing:-.1px; }
.cal-legend { display:flex; align-items:center; gap:10px; font-size:11px; font-weight:600; color:var(--ink-soft); }
.cal-legend span { display:inline-flex; align-items:center; }
.cal-legend i { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; }
.cal-nav { display:flex; gap:4px; margin-left:auto; }
.cal-nbtn {
  height:26px; padding:0 9px; font-size:11.5px; font-weight:600; line-height:1;
  border:1px solid var(--border); border-radius:var(--radius);
  background:var(--surface); color:var(--ink-soft); cursor:pointer;
  display:inline-flex; align-items:center; gap:4px; transition:all .12s;
}
.cal-nbtn:hover { border-color:var(--ink-soft); color:var(--ink); }
.cal-addbtn { background:var(--ink); border-color:var(--ink); color:#fff; font-weight:700; }
.cal-addbtn:hover { background:var(--accent); border-color:var(--accent); color:#fff; }
.cal-label { font-size:12px; font-weight:700; color:var(--ink-soft); text-align:center; min-width:92px; font-variant-numeric:tabular-nums; }
.cal-views { display:flex; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.cal-viewbtn {
  height:26px; padding:0 10px; font-size:11.5px; font-weight:600; border:none;
  background:var(--surface); color:var(--ink-dim); cursor:pointer; transition:all .12s;
}
.cal-viewbtn + .cal-viewbtn { border-left:1px solid var(--border); }
.cal-viewbtn.on { background:var(--ink); color:#fff; }
.cal-body { padding:0 14px 12px; }
.calsec.collapsed .cal-body { display:none; }

/* week — easy view */
.wk-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.wk-day {
  background:var(--surface); border:1px solid var(--border); border-radius:6px;
  padding:7px 7px 6px; min-height:92px;
  display:flex; flex-direction:column; gap:5px; min-width:0;
}
.wk-day.today { border-color:var(--accent); }
.wk-head { display:flex; align-items:center; gap:5px; }
.wk-dow { font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-dim); }
.wk-num { font-size:12px; font-weight:700; color:var(--ink-soft); }
.wk-num.t {
  background:var(--accent); color:#fff; border-radius:50%;
  width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; font-size:10.5px;
}
.wk-lib { margin-left:auto; font-size:9.5px; color:var(--ink-dim); font-weight:600; white-space:nowrap; }
.wk-chips { display:flex; flex-direction:column; gap:4px; flex:1; }
.wk-chip {
  border:1px solid var(--border); border-radius:4px;
  padding:3px 6px 3px 7px; cursor:pointer; text-align:left;
  display:flex; flex-direction:column; gap:1px; transition:border-color .12s;
}
.wk-chip:hover { border-color:var(--border-2); }
.wk-time { font-size:9.5px; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.wk-who { font-size:11px; font-weight:600; color:var(--ink); }
.wk-add {
  border:1px dashed var(--border-2); background:none; border-radius:4px;
  color:var(--ink-dim); font-size:12px; cursor:pointer; padding:1px 0 2px; transition:all .12s;
}
.wk-add:hover { color:var(--accent); border-color:var(--accent); }

/* week — full-hours grid */
.hr-wrap { overflow-x:auto; scrollbar-width:thin; scrollbar-color:var(--border-2) transparent; }
.hr-min { min-width:680px; }
.hr-scroll {
  max-height:440px; overflow-y:auto;
  border:1px solid var(--border); border-radius:6px; background:var(--surface);
  scrollbar-width:thin; scrollbar-color:var(--border-2) transparent;
}
.hr-heads {
  display:grid; grid-template-columns:46px repeat(7,1fr);
  position:sticky; top:0; z-index:6; background:var(--surface);
  border-bottom:1px solid var(--border);
}
.hr-dayhead { padding:6px 8px; display:flex; align-items:center; gap:5px; border-left:1px solid var(--border); min-width:0; }
.hr-dayhead.today { background:var(--accent-soft); }
.hr-grid { display:grid; grid-template-columns:46px repeat(7,1fr); position:relative; }
.hr-gutter { position:relative; }
.hr-lbl { position:absolute; right:6px; font-size:9px; color:var(--ink-dim); font-weight:600; font-variant-numeric:tabular-nums; }
.hr-col {
  position:relative; border-left:1px solid var(--border); cursor:copy;
  background-image:repeating-linear-gradient(to bottom, var(--border) 0 1px, transparent 1px 42px);
}
.hr-closed {
  position:absolute; left:0; right:0; pointer-events:none;
  background:rgba(36,33,29,.04);
  background-image:repeating-linear-gradient(135deg, rgba(36,33,29,.05) 0 1px, transparent 1px 8px);
}
.hr-shift {
  position:absolute; left:3px; right:3px; z-index:2;
  border:1px solid var(--border); border-radius:4px;
  padding:2px 5px; cursor:pointer; text-align:left; overflow:hidden;
  display:flex; flex-direction:column;
}
.hr-shift:hover { border-color:var(--border-2); z-index:3; }
.hs-1 { font-size:10px; font-weight:700; color:var(--ink); line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hs-2 { font-size:9px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.hr-now { position:absolute; left:0; right:0; height:2px; background:var(--hi); z-index:4; pointer-events:none; }
.hr-now::before { content:''; position:absolute; left:-2px; top:-2px; width:6px; height:6px; border-radius:50%; background:var(--hi); }

/* month */
.mo-grid { border:1px solid var(--border); border-radius:6px; overflow:hidden; background:var(--surface); }
.mo-head { display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--border); }
.mo-dow { padding:5px 7px; font-size:9.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-dim); }
.mo-cells { display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:minmax(76px,auto); }
.mo-cell {
  border-top:1px solid var(--border); border-left:1px solid var(--border);
  padding:4px 5px; cursor:copy; display:flex; flex-direction:column; gap:3px; min-width:0;
}
.mo-cell:nth-child(7n+1) { border-left:none; }
.mo-cell:nth-child(-n+7) { border-top:none; }
.mo-cell.out { background:var(--bg); }
.mo-cell.out .mo-num { opacity:.45; }
.mo-num {
  font-size:10.5px; font-weight:700; color:var(--ink-soft);
  width:17px; height:17px; display:flex; align-items:center; justify-content:center; border-radius:50%;
}
.mo-num.t { background:var(--accent); color:#fff; }
.mo-chip {
  border:1px solid var(--border); border-radius:3px; cursor:pointer;
  padding:1px 4px; display:flex; align-items:center; gap:3px; text-align:left; min-width:0;
}
.mo-chip:hover { border-color:var(--border-2); }
.mo-chip .ico { font-size:9px; line-height:1; }
.mo-chip .t { font-size:9px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mo-more { font-size:9px; color:var(--ink-dim); font-weight:700; }

/* shift modal extras */
.preset-row { display:flex; flex-wrap:wrap; gap:6px; }
.preset {
  padding:4px 10px; font-size:11px; font-weight:600;
  border:1px solid var(--border-2); border-radius:12px;
  background:transparent; color:var(--ink-soft); cursor:pointer; transition:all .12s;
}
.preset:hover { border-color:var(--accent); color:var(--accent); }
.foot-group { display:flex; gap:8px; align-items:center; }

/* ═══════════════════ RESPONSIVE ═══════════════════ */
@media (max-width: 860px) {
  .hcontrols input.ctrl { display:none; }
  .hcontrols select.ctrl { display:none; }
  .header { gap:8px; }
  .tabbar { display:flex; }

  .board {
    display:block; background:var(--bg); border-top:none;
  }
  .col {
    display:none;
    max-height:calc(100vh - 134px);
  }
  .col.active-mobile { display:flex; }
  .col-header { padding:10px 14px 6px; }
  .quick-add-row { padding:0 12px 8px; }
  .col-body { padding:0 12px 14px; }

  .cal-toolbar { padding:8px 12px 6px; gap:6px; }
  .cal-legend { display:none; }
  .cal-label { min-width:0; }
  .cal-body { padding:0 12px 10px; }
  .wk-grid { display:flex; overflow-x:auto; gap:6px; padding-bottom:2px; scrollbar-width:none; }
  .wk-grid::-webkit-scrollbar { display:none; }
  .wk-day { flex:0 0 136px; }
  .mo-cells { grid-auto-rows:minmax(56px,auto); }
  .mo-chip .t { display:none; }
}
