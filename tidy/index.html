<script type="module">
import { initializeApp } from
  'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, onValue } from
  'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

/* ──────── FIREBASE CONFIG ──────── */
const firebaseConfig = {
  apiKey: "AIzaSyCX9LqCG0G_zLFIii3hYQYpA5Cz3vXO1m8",
  authDomain: "gratifiedwegrow.firebaseapp.com",
  databaseURL: "https://gratifiedwegrow-default-rtdb.firebaseio.com",
  projectId: "gratifiedwegrow",
  storageBucket: "gratifiedwegrow.firebasestorage.app",
  messagingSenderId: "620449599596",
  appId: "1:620449599596:web:4fcb7277f32cf636780849"
};

const app  = initializeApp(firebaseConfig);
const rtdb = getDatabase(app);
const stateRef  = ref(rtdb, 'ops-board/state');
const shiftsRef = ref(rtdb, 'ops-board/shifts');

/* ──────── CONSTANTS ──────── */
const COLS = [
  { id:'ideas',      label:'Ideas',       dot:'#722F37' },
  { id:'backlog',    label:'Backlog',     dot:'#A24A3B' },
  { id:'thisweek',   label:'This Week',   dot:'#C4501E' },
  { id:'inprogress', label:'In Progress', dot:'#B8792E' },
  { id:'waiting',    label:'Waiting',     dot:'#8C826A' },
  { id:'done',       label:'Done',        dot:'#A79E8C' },
];

const LABELS    = ['supply','ops','event','art','finance','menu','community','health','staff','urgent'];
const PRI_COLOR = { high:'#C4501E', medium:'#B8792E', low:'#8C826A' };
const SUB_COLLAPSE_AT = 6;
const GATE_WORD = 'rabbit';

/* ── schedule constants ── */
/* SF Main Library hours — 0=Sun … 6=Sat. Edit here if SFPL changes them. */
const LIB_HOURS = {
  0: { open:'12:00', close:'18:00' },   /* Sun 12–6  */
  1: { open:'09:00', close:'18:00' },   /* Mon 9–6   */
  2: { open:'09:00', close:'20:00' },   /* Tue 9–8   */
  3: { open:'09:00', close:'20:00' },   /* Wed 9–8   */
  4: { open:'09:00', close:'20:00' },   /* Thu 9–8   */
  5: { open:'12:00', close:'18:00' },   /* Fri 12–6  */
  6: { open:'10:00', close:'18:00' },   /* Sat 10–6  */
};
const PEOPLE = [
  { id:'leah',  name:'Leah',  color:'#722F37' },
  { id:'betty', name:'Betty', color:'#CC5500' },
  { id:'both',  name:'Both',  color:'#6B5740' },
];
const SHIFT_TYPES = [
  { id:'library', label:'Library shift', icon:'☕' },
  { id:'pastry',  label:'Pastry pickup', icon:'🥐' },
  { id:'prep',    label:'Food prep',     icon:'🔪' },
  { id:'clean',   label:'Cleaning',      icon:'🧽' },
  { id:'other',   label:'Other',         icon:'📌' },
];
const DAY_START = 7 * 60;    /* hours grid runs 7:00 …            */
const DAY_END   = 22 * 60;   /* … to 22:00 (covers 8p closes)     */
const HOUR_PX   = 42;
const LIB_LOC   = 'San Francisco Main Library, 100 Larkin St, San Francisco, CA 94102';

/* your palette */
const PALETTE = [
  { name:'Deep red',     hex:'#722F37' },
  { name:'Bright orange',hex:'#CC5500' },
  { name:'Warm amber',   hex:'#D2691E' },
  { name:'Olive bronze', hex:'#6B5740' },
  { name:'Cream',        hex:'#EDE8E0' },
  { name:'Charcoal',     hex:'#3C3C3C' },
  { name:'Golden sand',  hex:'#E6C89C' },
];
const DEFAULT_COLOR = '#722F37';
const SEED = [
  { name:'Wedding coffee cart', color:'#D2691E' },
  { name:'Protest slushies',    color:'#CC5500' },
  { name:'Cafe',                color:'#722F37' },
];

/* ──────── SAFE DEVICE STORAGE ──────── */
const mem = {};
const store = {
  get(k){
    try { const v = localStorage.getItem(k);   if (v !== null) return v; } catch(e){}
    try { const v = sessionStorage.getItem(k); if (v !== null) return v; } catch(e){}
    return (k in mem) ? mem[k] : null;
  },
  set(k,v){
    try { localStorage.setItem(k,v);   return; } catch(e){}
    try { sessionStorage.setItem(k,v); return; } catch(e){}
    mem[k] = v;
  },
  del(k){
    try { localStorage.removeItem(k);   } catch(e){}
    try { sessionStorage.removeItem(k); } catch(e){}
    delete mem[k];
  }
};

/* ──────── STATE ──────── */
let db = { projects:{}, projectOrder:[] };
let activeProject   = null;   // local / per-device
let openId          = null;   // task modal
let openProj        = null;   // project settings modal
let drag            = null;   // task drag
let projDrag        = null;   // project pill drag
let subTarget       = null;
let flt             = { search:'', pri:'', label:'' };
let activeMobileCol = 'ideas';
let expandedSubs    = new Set();
let renamingPid     = null;
let showArchived    = false;
let syncStarted     = false;

/* schedule state */
let shifts       = {};
let shiftDraft   = null;   // shift modal working copy
let calAnchor    = new Date();
let calView      = store.get('cal-view');
if (!['week','hours','month'].includes(calView)) calView = 'week';
let calCollapsed = store.get('cal-collapsed') === '1';

/* ──────── HELPERS ──────── */
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function esc(s='') {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) { return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtFull(iso) { return iso ? new Date(iso).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : ''; }
/* readable text colour for a given background */
function readableText(hex) {
  const c = String(hex||'').replace('#','');
  if (c.length < 6) return '#ffffff';
  const r=parseInt(c.slice(0,2),16), g=parseInt(c.slice(2,4),16), b=parseInt(c.slice(4,6),16);
  const L=(0.299*r+0.587*g+0.114*b)/255;
  return L > 0.62 ? '#3C3C3C' : '#ffffff';
}

/* ──────── PROJECT MODEL ──────── */
function makeProject(name, color) {
  return {
    id: uid(), name,
    color: color || DEFAULT_COLOR,
    archived: false,
    tasks: {},
    columns: Object.fromEntries(COLS.map(c => [c.id, []])),
    createdAt: new Date().toISOString(),
  };
}
function activeProj() { return db.projects?.[activeProject] || null; }

function normalize(val) {
  if (val && val.projects && Object.keys(val.projects).length) {
    val.projectOrder = Array.isArray(val.projectOrder) ? val.projectOrder : Object.keys(val.projects);
    Object.keys(val.projects).forEach(id => { if (!val.projectOrder.includes(id)) val.projectOrder.push(id); });
    val.projectOrder = val.projectOrder.filter(id => val.projects[id]);
    Object.values(val.projects).forEach(p => {
      p.tasks = p.tasks || {};
      p.columns = p.columns || {};
      COLS.forEach(c => { if (!Array.isArray(p.columns[c.id])) p.columns[c.id] = []; });
      if (!p.color) p.color = DEFAULT_COLOR;
      if (typeof p.archived !== 'boolean') p.archived = false;
    });
    return { data: val, changed: false };
  }

  const projects = {}, order = [];
  const push = p => { projects[p.id] = p; order.push(p.id); };

  if (val && val.tasks && Object.keys(val.tasks).length) {
    const p = makeProject('General', DEFAULT_COLOR);
    p.tasks = val.tasks;
    p.columns = val.columns || p.columns;
    COLS.forEach(c => { if (!Array.isArray(p.columns[c.id])) p.columns[c.id] = []; });
    push(p);
  }
  SEED.forEach(s => push(makeProject(s.name, s.color)));

  return { data: { projects, projectOrder: order }, changed: true };
}

/* ──────── SYNC ──────── */
function startSync() {
  onValue(stateRef, snap => {
    const { data, changed } = normalize(snap.val());
    db = data;
    if (!activeProject || !db.projects[activeProject] || db.projects[activeProject].archived) {
      const saved = store.get('activeProject');
      const savedOk = saved && db.projects[saved] && !db.projects[saved].archived;
      activeProject = savedOk ? saved
        : (db.projectOrder.find(id => !db.projects[id].archived) || db.projectOrder[0]);
    }
    populateLabelSel();
    render();
    if (changed) save();
  }, err => console.error('RTDB read error:', err));
  onValue(shiftsRef, snap => {
    shifts = snap.val() || {};
    renderCal();
  }, err => console.error('RTDB shifts read error:', err));
}
async function save() {
  try { await set(stateRef, JSON.parse(JSON.stringify(db))); }
  catch (e) { console.error('RTDB write error:', e); }
}
async function saveShifts() {
  try { await set(shiftsRef, JSON.parse(JSON.stringify(shifts))); }
  catch (e) { console.error('RTDB shifts write error:', e); }
}

/* ──────── FOCUS PRESERVATION ──────── */
function cssEsc(s){ return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g,'\\$&'); }
function isTransientKey(k){ return k.startsWith('quick:') || k.startsWith('subadd:') || k.startsWith('rename:') || k.startsWith('projname:'); }
function captureFocus() {
  const el = document.activeElement;
  if (!el || !el.getAttribute) return null;
  const key = el.getAttribute('data-fkey');
  if (!key) return null;
  let start = null, end = null;
  try { start = el.selectionStart; end = el.selectionEnd; } catch(e){}
  const transient = isTransientKey(key);
  return { key, start, end, val: transient ? el.value : null, transient };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.querySelector(`[data-fkey="${cssEsc(f.key)}"]`);
  if (!el) return;
  if (f.transient && f.val != null && 'value' in el) el.value = f.val;
  el.focus();
  try {
    const len = (el.value || '').length;
    const s = f.start == null ? len : Math.min(f.start, len);
    const e = f.end   == null ? len : Math.min(f.end,   len);
    if (el.setSelectionRange) el.setSelectionRange(s, e);
  } catch(e){}
}

/* ──────── FILTER ──────── */
function populateLabelSel() {
  const sel = document.getElementById('filtLabel');
  if (!sel) return;
  const prev = sel.value;
  sel.innerHTML = '<option value="">Label</option>' +
    LABELS.map(l => `<option value="${l}">${l}</option>`).join('');
  sel.value = prev;
}
window.applyFilter = function () {
  flt.search = document.getElementById('search').value.toLowerCase();
  flt.pri    = document.getElementById('filtPri').value;
  flt.label  = document.getElementById('filtLabel').value;
  render();
};
function visible(t) {
  if (!t) return false;
  if (flt.search && !t.title.toLowerCase().includes(flt.search) &&
      !(t.description||'').toLowerCase().includes(flt.search)) return false;
  if (flt.pri   && t.priority !== flt.pri) return false;
  if (flt.label && !(t.labels||[]).includes(flt.label)) return false;
  return true;
}

/* ──────── RENDER ──────── */
function render() {
  const f = captureFocus();
  renderStats(); renderProjects(); renderTabs(); renderBoard();
  restoreFocus(f);
}

function renderStats() {
  const p = activeProj();
  const tasks = p ? Object.values(p.tasks||{}) : [];
  const total = tasks.length;
  const doneN = p ? (p.columns?.done||[]).length : 0;
  const activeN = p ? (p.columns?.inprogress||[]).length : 0;
  const now = new Date();
  const odN = tasks.filter(t =>
    t.dueDate && new Date(t.dueDate+'T00:00:00') < now && t.column !== 'done'
  ).length;
  document.getElementById('stats').innerHTML =
    `<strong>${total}</strong> tasks · <strong>${activeN}</strong> active · <strong>${doneN}</strong> done` +
    (odN ? ` · <span class="warn">${odN} overdue</span>` : '');
}

/* ──────── PROJECT BAR ──────── */
function renderProjects() {
  const bar = document.getElementById('projbar');
  if (!bar) return;
  const order = db.projectOrder || [];
  const mainIds = order.filter(pid => db.projects[pid] && (!db.projects[pid].archived || pid === activeProject));
  const archIds = order.filter(pid => db.projects[pid] && db.projects[pid].archived && pid !== activeProject);

  const pill = (pid) => {
    const p = db.projects[pid];
    const active = pid === activeProject;
    const color = p.color || DEFAULT_COLOR;
    const count = Object.keys(p.tasks||{}).length;
    if (renamingPid === pid) {
      return `<div class="proj-pill active editing" style="background:${color};border-color:${color}">
        <input class="proj-rename" data-fkey="rename:${pid}" value="${esc(p.name)}"
          style="color:${readableText(color)}"
          onkeydown="projRenameKey(event,'${pid}')" onblur="commitRename('${pid}',this.value)"></div>`;
    }
    const txt = active ? readableText(color) : 'var(--ink-soft)';
    return `<div class="proj-pill${active?' active':''}" data-pid="${pid}" draggable="true"
        onclick="switchProject('${pid}')" ondblclick="startRename('${pid}')"
        style="${active?`background:${color};border-color:${color};color:${txt};`:''}"
        title="Click to open · double-click to rename · drag to reorder">
      <span class="proj-dot" style="background:${active?txt:color}"></span>
      <span class="proj-name">${esc(p.name)}</span>
      <span class="proj-count">${count}</span>
      ${active ? `<button class="proj-more" style="color:${txt}" title="Project settings" onclick="event.stopPropagation();openProjectSettings('${pid}')">⋯</button>` : ''}
    </div>`;
  };

  let html = mainIds.map(pill).join('');
  html += `<button class="proj-add" title="New project" onclick="addProject()">+</button>`;

  if (archIds.length) {
    html += `<button class="proj-arch-toggle" onclick="toggleArchivedView()">${showArchived?'Hide archived':'Archived ('+archIds.length+')'}</button>`;
    if (showArchived) {
      html += archIds.map(pid => {
        const p = db.projects[pid];
        const color = p.color || DEFAULT_COLOR;
        return `<div class="proj-pill archived" data-pid="${pid}" draggable="false"
            onclick="switchProject('${pid}')" title="Archived — click to view">
          <span class="proj-dot" style="background:${color}"></span>
          <span class="proj-name">${esc(p.name)}</span>
          <button class="proj-more" title="Project settings" onclick="event.stopPropagation();openProjectSettings('${pid}')">⋯</button>
        </div>`;
      }).join('');
    }
  }
  bar.innerHTML = html;
}

/* project-pill drag-to-reorder (delegated, attached once) */
function attachProjbarDnD() {
  const bar = document.getElementById('projbar');
  if (!bar) return;
  bar.addEventListener('dragstart', e => {
    const pill = e.target.closest?.('.proj-pill[draggable="true"]');
    if (!pill) return;
    projDrag = pill.dataset.pid;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => pill.classList.add('pdrag'), 0);
  });
  bar.addEventListener('dragover', e => {
    if (!projDrag) return;
    const pill = e.target.closest?.('.proj-pill[data-pid]');
    if (!pill || pill.dataset.pid === projDrag) return;
    e.preventDefault();
    bar.querySelectorAll('.pdrop').forEach(x => x.classList.remove('pdrop'));
    pill.classList.add('pdrop');
  });
  bar.addEventListener('drop', e => {
    if (!projDrag) return;
    const pill = e.target.closest?.('.proj-pill[data-pid]');
    e.preventDefault();
    if (pill && pill.dataset.pid !== projDrag) {
      const order = db.projectOrder;
      order.splice(order.indexOf(projDrag), 1);
      order.splice(order.indexOf(pill.dataset.pid), 0, projDrag);
      save();
    }
    projDrag = null; render();
  });
  bar.addEventListener('dragend', () => {
    projDrag = null;
    bar.querySelectorAll('.pdrag,.pdrop').forEach(x => x.classList.remove('pdrag','pdrop'));
  });
}

window.switchProject = function (pid) {
  if (!db.projects[pid]) return;
  activeProject = pid; store.set('activeProject', pid);
  activeMobileCol = COLS[0].id;
  render();
};
window.addProject = function () {
  const p = makeProject('New project');
  db.projects[p.id] = p;
  db.projectOrder.push(p.id);
  activeProject = p.id; store.set('activeProject', p.id);
  save(); render();
  setTimeout(() => startRename(p.id), 40);
};
window.startRename = function (pid) {
  renamingPid = pid; renderProjects();
  setTimeout(() => {
    const el = document.querySelector(`[data-fkey="rename:${pid}"]`);
    if (el) { el.focus(); el.select(); }
  }, 20);
};
window.projRenameKey = function (e, pid) {
  if (e.key === 'Enter') e.target.blur();
  else if (e.key === 'Escape') { renamingPid = null; renderProjects(); }
};
window.commitRename = function (pid, val) {
  const p = db.projects[pid];
  renamingPid = null;
  if (p) { val = (val||'').trim(); if (val && val !== p.name) { p.name = val; save(); } }
  render();
};
window.toggleArchivedView = function () { showArchived = !showArchived; renderProjects(); };

/* ──────── PROJECT SETTINGS MODAL ──────── */
window.openProjectSettings = function (pid) {
  openProj = pid; renderProjSettings(pid);
  document.getElementById('proj-backdrop').style.display = 'flex';
};
window.closeProjSettings = function () {
  document.getElementById('proj-backdrop').style.display = 'none'; openProj = null;
};
window.projBackdropClick = function (e) { if (e.target.id === 'proj-backdrop') closeProjSettings(); };

function renderProjSettings(pid) {
  const p = db.projects[pid];
  if (!p) return closeProjSettings();
  const color = p.color || DEFAULT_COLOR;
  const idx = db.projectOrder.indexOf(pid);
  const last = db.projectOrder.length - 1;
  const nonArch = db.projectOrder.filter(id => !db.projects[id].archived).length;
  const canArchive = p.archived || nonArch > 1;

  document.getElementById('proj-eyebrow').innerHTML =
    `<div style="width:8px;height:8px;border-radius:50%;background:${color}"></div>Project settings`;

  const swatches = PALETTE.map(c =>
    `<button class="swatch${color===c.hex?' on':''}" title="${c.name}" style="background:${c.hex}"
       onclick="setProjColor('${pid}','${c.hex}')"></button>`
  ).join('');

  document.getElementById('proj-body').innerHTML =
    `<div>
       <div class="f-label">Name</div>
       <input class="f-input" data-fkey="projname:${pid}" value="${esc(p.name)}"
         oninput="patchProjName('${pid}',this.value)">
     </div>
     <div>
       <div class="f-label">Colour</div>
       <div class="swatch-row">${swatches}</div>
     </div>
     <div class="f-row">
       <div>
         <div class="f-label">Order</div>
         <div style="display:flex;gap:6px;">
           <button class="btn btn-ghost" ${idx<=0?'disabled':''} onclick="moveProject('${pid}',-1)">‹ Left</button>
           <button class="btn btn-ghost" ${idx>=last?'disabled':''} onclick="moveProject('${pid}',1)">Right ›</button>
         </div>
       </div>
       <div>
         <div class="f-label">${p.archived?'Archived':'Archive'}</div>
         <button class="btn btn-ghost" ${canArchive?'':'disabled'} onclick="toggleArchiveProject('${pid}')">
           ${p.archived?'Unarchive':'Archive'}</button>
       </div>
     </div>
     <div class="meta-text">Position ${idx+1} of ${db.projectOrder.length} · created ${fmtFull(p.createdAt)}</div>`;

  document.getElementById('proj-foot').innerHTML =
    `<button class="btn btn-danger" onclick="deleteProjectConfirm('${pid}')">Delete project</button>
     <button class="btn btn-primary" onclick="closeProjSettings()">Done</button>`;
}

window.patchProjName = function (pid, val) {
  const p = db.projects[pid]; if (!p) return;
  p.name = val; save(); renderProjects();
};
window.setProjColor = function (pid, hex) {
  const p = db.projects[pid]; if (!p) return;
  p.color = hex; save(); renderProjects(); renderProjSettings(pid);
};
window.moveProject = function (pid, dir) {
  const order = db.projectOrder;
  const i = order.indexOf(pid), j = i + dir;
  if (i < 0 || j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  save(); renderProjects(); renderProjSettings(pid);
};
window.toggleArchiveProject = function (pid) {
  const p = db.projects[pid]; if (!p) return;
  if (!p.archived) {
    const nonArch = db.projectOrder.filter(id => !db.projects[id].archived).length;
    if (nonArch <= 1) { alert('Keep at least one active project — add another before archiving this one.'); return; }
    p.archived = true;
    if (activeProject === pid) {
      activeProject = db.projectOrder.find(id => !db.projects[id].archived);
      store.set('activeProject', activeProject);
    }
  } else {
    p.archived = false;
  }
  save(); render(); renderProjSettings(pid);
};
window.deleteProjectConfirm = function (pid) {
  if (db.projectOrder.length <= 1) { alert('Can’t delete your only project.'); return; }
  if (!confirm('Delete this project and everything in it? This cannot be undone.')) return;
  delete db.projects[pid];
  db.projectOrder = db.projectOrder.filter(x => x !== pid);
  if (activeProject === pid) {
    activeProject = db.projectOrder.find(id => !db.projects[id].archived) || db.projectOrder[0];
    store.set('activeProject', activeProject);
  }
  closeProjSettings(); save(); render();
};

/* ──────── MOBILE COLUMN TABS ──────── */
function renderTabs() {
  const bar = document.getElementById('tabbar');
  if (!bar) return;
  const p = activeProj();
  if (!COLS.find(c=>c.id===activeMobileCol)) activeMobileCol = COLS[0].id;
  bar.innerHTML = COLS.map(c => {
    const n = p ? (p.columns?.[c.id]||[]).length : 0;
    return `<button class="tab-pill${c.id===activeMobileCol?' active':''}" onclick="setActiveTab('${c.id}')">
      <span class="dot" style="background:${c.id===activeMobileCol?'#fff':c.dot}"></span>${c.label}<span class="n">${n}</span>
    </button>`;
  }).join('');
}
window.setActiveTab = function (colId) {
  activeMobileCol = colId;
  renderTabs();
  document.querySelectorAll('.col').forEach(el => {
    el.classList.toggle('active-mobile', el.dataset.col === colId);
  });
};

/* ──────── BOARD ──────── */
function renderBoard() {
  const board = document.getElementById('board');
  if (!board) return;
  board.innerHTML = '';
  const p = activeProj();
  if (!p) return;
  COLS.forEach(col => board.appendChild(buildCol(col, p)));
  const activeEl = board.querySelector(`[data-col="${activeMobileCol}"]`);
  if (activeEl) activeEl.classList.add('active-mobile');
}

function buildCol(col, p) {
  const allIds = p.columns?.[col.id] || [];
  const visIds = allIds.filter(id => visible(p.tasks?.[id]));

  const wrap = document.createElement('div');
  wrap.className = 'col';
  wrap.dataset.col = col.id;

  wrap.addEventListener('dragover', e => {
    if (!drag) return;
    e.preventDefault();
    if (!subTarget) wrap.classList.add('drop-target');
  });
  wrap.addEventListener('dragleave', e => {
    if (!wrap.contains(e.relatedTarget)) wrap.classList.remove('drop-target');
  });
  wrap.addEventListener('drop', e => {
    e.preventDefault();
    wrap.classList.remove('drop-target');
    if (drag && !subTarget) { moveTask(drag.taskId, drag.colId, col.id); drag = null; }
  });

  const head = document.createElement('div');
  head.className = 'col-header';
  head.innerHTML =
    `<div class="col-dot" style="background:${col.dot}"></div>
     <span class="col-title">${col.label}</span>
     <span class="col-count">${allIds.length}</span>`;
  wrap.appendChild(head);

  const qrow = document.createElement('div');
  qrow.className = 'quick-add-row';
  const qi = document.createElement('input');
  qi.type = 'text';
  qi.className = 'quick-add';
  qi.placeholder = '+ task';
  qi.setAttribute('data-fkey', 'quick:' + col.id);
  qi.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const title = qi.value.trim();
      qi.value = '';
      if (title) quickAddTask(col.id, title);
    }
    if (e.key === 'Escape') { qi.value = ''; qi.blur(); }
  });
  qrow.appendChild(qi);
  wrap.appendChild(qrow);

  const body = document.createElement('div');
  body.className = 'col-body';
  if (visIds.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'col-empty';
    empty.textContent = (flt.search||flt.pri||flt.label) ? 'no matches' : 'nothing here — add one above';
    body.appendChild(empty);
  } else {
    visIds.forEach(id => { const c = buildCard(p.tasks[id], col); if (c) body.appendChild(c); });
  }
  wrap.appendChild(body);

  return wrap;
}

function buildCard(task, col) {
  if (!task) return null;
  const isDone  = task.column === 'done';
  const isOD    = !isDone && task.dueDate && new Date(task.dueDate+'T00:00:00') < new Date();
  const subs     = task.subtasks || [];
  const subsDone = subs.filter(s => s.done).length;
  const expanded = expandedSubs.has(task.id);
  const showSubs = expanded ? subs : subs.slice(0, SUB_COLLAPSE_AT);
  const hiddenN  = subs.length - showSubs.length;

  const idx = COLS.findIndex(c => c.id === task.column);
  const prevCol = COLS[idx-1], nextCol = COLS[idx+1];

  const card = document.createElement('div');
  card.className = 'task' + (isDone ? ' done' : '');
  card.style.setProperty('--pri-color', PRI_COLOR[task.priority] || 'transparent');
  card.dataset.task = task.id;
  card.draggable = true;

  const subRowsHtml = showSubs.map(s =>
    `<div class="sub-row${s.done?' done':''}" data-sub="${s.id}">
       <input type="checkbox" class="sub-check" ${s.done?'checked':''} onchange="toggleSubInline('${task.id}','${s.id}')">
       <input type="text" class="sub-text" data-fkey="sub:${task.id}:${s.id}" value="${esc(s.title)}"
         onblur="patchSubInline('${task.id}','${s.id}',this.value)"
         onkeydown="if(event.key==='Enter')this.blur()">
       <button class="sub-x" onclick="deleteSubInline('${task.id}','${s.id}')">×</button>
     </div>`
  ).join('');

  card.innerHTML =
    `<div class="task-top">
       <div class="task-main" data-open="${task.id}">
         <div class="task-main-title">${esc(task.title)}${subs.length?`<span class="task-count-badge">${subsDone}/${subs.length}</span>`:''}</div>
         ${task.description ? `<div class="task-desc">${esc(task.description)}</div>` : ''}
       </div>
       <button class="task-del" onclick="event.stopPropagation();deleteTask('${task.id}')">×</button>
     </div>
     <div class="subs" data-subs="${task.id}">
       ${subRowsHtml}
       ${hiddenN > 0 ? `<button class="sub-more" onclick="expandSubs('${task.id}')">+ ${hiddenN} more</button>` : ''}
       <input type="text" class="sub-add" data-fkey="subadd:${task.id}" placeholder="+ subtask"
         onkeydown="subAddKey(event,'${task.id}')">
     </div>
     <div class="task-footer">
       ${task.dueDate  ? `<span class="task-due${isOD?' overdue':''}">${fmtDate(task.dueDate)}</span>` : ''}
       ${(task.labels||[]).map(l=>`<span class="task-label">${l}</span>`).join('')}
       <div class="task-move">
         <button class="mv-btn" title="Move to ${prevCol?prevCol.label:''}" ${!prevCol?'disabled':''} onclick="event.stopPropagation();moveTask('${task.id}','${task.column}','${prevCol?prevCol.id:''}')">‹</button>
         <button class="mv-btn" title="Move to ${nextCol?nextCol.label:''}" ${!nextCol?'disabled':''} onclick="event.stopPropagation();moveTask('${task.id}','${task.column}','${nextCol?nextCol.id:''}')">›</button>
       </div>
     </div>`;

  card.querySelector('.task-main').onclick = () => openModal(task.id);

  card.addEventListener('dragstart', e => {
    drag = { taskId:task.id, colId:task.column };
    setTimeout(() => card.classList.add('dragging'), 0);
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    drag = null; clearSubTarget();
    document.querySelectorAll('.col').forEach(c => c.classList.remove('drop-target'));
  });
  card.addEventListener('dragover', e => {
    if (!drag || drag.taskId === task.id) return;
    e.preventDefault(); e.stopPropagation();
    document.querySelectorAll('.col').forEach(c => c.classList.remove('drop-target'));
    if (subTarget !== task.id) { clearSubTarget(); subTarget = task.id; card.classList.add('sub-target'); }
  });
  card.addEventListener('dragleave', e => {
    if (!card.contains(e.relatedTarget)) {
      card.classList.remove('sub-target');
      if (subTarget === task.id) subTarget = null;
    }
  });
  card.addEventListener('drop', e => {
    if (!drag || drag.taskId === task.id) return;
    e.preventDefault(); e.stopPropagation();
    card.classList.remove('sub-target'); subTarget = null;
    collapseToSub(task.id, drag.taskId); drag = null;
  });

  return card;
}

window.expandSubs = function (taskId) { expandedSubs.add(taskId); render(); };

function clearSubTarget() {
  if (subTarget) {
    document.querySelector(`[data-task="${subTarget}"]`)?.classList.remove('sub-target');
    subTarget = null;
  }
}

/* ──────── QUICK ADD ──────── */
function quickAddTask(colId, title) {
  const p = activeProj(); if (!p) return;
  const id = uid();
  p.tasks[id] = {
    id, title, description:'', priority:'medium',
    dueDate:'', labels:[], subtasks:[],
    column:colId, createdAt:new Date().toISOString(),
  };
  p.columns[colId] = [...(p.columns[colId]||[]), id];
  save(); render();
}

/* ──────── COLLAPSE CARD → SUBTASK ──────── */
function collapseToSub(parentId, childId) {
  const p = activeProj(); if (!p) return;
  const parent = p.tasks?.[parentId];
  const child  = p.tasks?.[childId];
  if (!parent || !child) return;
  parent.subtasks = parent.subtasks || [];
  parent.subtasks.push({ id:uid(), title:child.title, done:false });
  p.columns[child.column] = (p.columns[child.column]||[]).filter(i => i !== childId);
  delete p.tasks[childId];
  expandedSubs.add(parentId);
  save(); render();
  if (openId === childId)  closeModal();
  if (openId === parentId) renderModal(parentId);
}

/* ──────── MOVE / DELETE ──────── */
function moveTask(taskId, from, to) {
  const p = activeProj(); if (!p) return;
  if (!to || from === to || !p.tasks?.[taskId]) return;
  p.tasks[taskId].column = to;
  p.columns[from] = (p.columns[from]||[]).filter(i => i !== taskId);
  p.columns[to]   = [...(p.columns[to]||[]), taskId];
  save(); render();
  if (openId === taskId) renderModal(taskId);
}
window.moveTask = moveTask;

window.deleteTask = function (taskId) {
  const p = activeProj(); if (!p) return;
  const col = p.tasks?.[taskId]?.column;
  if (!col) return;
  delete p.tasks[taskId];
  p.columns[col] = (p.columns[col]||[]).filter(i => i !== taskId);
  save(); render();
  if (openId === taskId) closeModal();
};

window.moveTaskToProject = function (taskId, targetPid) {
  const src = activeProj(); if (!src) return;
  const t = src.tasks?.[taskId]; if (!t) return;
  const dst = db.projects[targetPid];
  if (!dst || targetPid === activeProject) return;
  const col = t.column;
  src.columns[col] = (src.columns[col]||[]).filter(i => i !== taskId);
  delete src.tasks[taskId];
  dst.tasks[taskId] = t;
  if (!Array.isArray(dst.columns[col])) dst.columns[col] = [];
  dst.columns[col] = [...dst.columns[col], taskId];
  save(); closeModal(); render();
};

/* ──────── INLINE SUBTASK OPS (on card) ──────── */
window.toggleSubInline = function (taskId, subId) {
  const p = activeProj(); const t = p?.tasks?.[taskId]; if (!t) return;
  const s = (t.subtasks||[]).find(x => x.id===subId);
  if (s) { s.done=!s.done; save(); render(); if (openId===taskId) renderModal(taskId); }
};
window.patchSubInline = function (taskId, subId, value) {
  const p = activeProj(); const t = p?.tasks?.[taskId]; if (!t) return;
  const s = (t.subtasks||[]).find(x => x.id===subId);
  if (s && s.title!==value) { s.title=value; save(); render(); if (openId===taskId) renderModal(taskId); }
};
window.deleteSubInline = function (taskId, subId) {
  const p = activeProj(); const t = p?.tasks?.[taskId]; if (!t) return;
  t.subtasks = (t.subtasks||[]).filter(x => x.id!==subId);
  save(); render(); if (openId===taskId) renderModal(taskId);
};
window.addSubInline = function (taskId, title) {
  title = (title||'').trim(); if (!title) return;
  const p = activeProj(); const t = p?.tasks?.[taskId]; if (!t) return;
  t.subtasks = t.subtasks||[];
  t.subtasks.push({ id:uid(), title, done:false });
  expandedSubs.add(taskId);
  save(); render();                       // focus-preserving → cursor stays in "+ subtask"
  if (openId===taskId) renderModal(taskId);
};
/* clear first, then add → the re-focused "+ subtask" box stays empty so you keep listing */
window.subAddKey = function (e, taskId) {
  if (e.key === 'Enter') {
    const v = e.target.value.trim();
    e.target.value = '';
    if (v) addSubInline(taskId, v);
  }
};

/* ──────── TASK MODAL ──────── */
function openModal(taskId) {
  openId = taskId; renderModal(taskId);
  document.getElementById('backdrop').style.display = 'flex';
}
window.closeModal = function () {
  document.getElementById('backdrop').style.display = 'none'; openId = null;
};
window.backdropClick = function (e) { if (e.target.id === 'backdrop') closeModal(); };

function renderModal(taskId) {
  const p = activeProj();
  const t = p?.tasks?.[taskId];
  if (!t) return closeModal();
  const col = COLS.find(c => c.id === t.column) || COLS[0];

  document.getElementById('modal-eyebrow').innerHTML =
    `<div style="width:7px;height:7px;border-radius:50%;background:${col.dot}"></div>${col.label}`;

  const colOpts = COLS.map(c =>
    `<option value="${c.id}"${t.column===c.id?' selected':''}>${c.label}</option>`
  ).join('');

  const projOpts = db.projectOrder.map(pid =>
    `<option value="${pid}"${pid===activeProject?' selected':''}>${esc(db.projects[pid].name)}</option>`
  ).join('');

  const lblBtns = LABELS.map(l =>
    `<button class="lbl-btn${(t.labels||[]).includes(l)?' on':''}"
       onclick="toggleLabel('${taskId}','${l}')">${l}</button>`
  ).join('');

  const subHtml = (t.subtasks||[]).map(s =>
    `<div class="mrow${s.done?' done':''}" data-sub="${s.id}">
       <input type="checkbox" class="mcheck" ${s.done?'checked':''} onchange="toggleSub('${taskId}','${s.id}')">
       <input type="text" class="mtitle" value="${esc(s.title)}"
         onblur="patchSub('${taskId}','${s.id}',this.value)"
         onkeydown="if(event.key==='Enter')this.blur()">
       <button class="mdel" onclick="deleteSub('${taskId}','${s.id}')">×</button>
     </div>`
  ).join('');

  document.getElementById('modal-body').innerHTML =
    `<div>
       <div class="f-label">Title</div>
       <input class="f-input f-title" value="${esc(t.title)}"
         oninput="patchField('${taskId}','title',this.value)">
     </div>
     <div>
       <div class="f-label">Description</div>
       <textarea class="f-input f-desc"
         oninput="patchField('${taskId}','description',this.value)"
         placeholder="Notes, links, context…">${esc(t.description||'')}</textarea>
     </div>
     <div class="f-row">
       <div>
         <div class="f-label">Priority</div>
         <div class="pri-group">
           ${['high','medium','low'].map(pr =>
             `<button class="pri-btn${t.priority===pr?' on':''}" data-p="${pr}"
                onclick="setPri('${taskId}','${pr}')"><span class="d" style="background:${t.priority===pr?'#fff':PRI_COLOR[pr]}"></span>${pr==='medium'?'Med':pr[0].toUpperCase()+pr.slice(1)}</button>`
           ).join('')}
         </div>
       </div>
       <div>
         <div class="f-label">Due Date</div>
         <input class="f-input" type="date" value="${t.dueDate||''}"
           onchange="patchField('${taskId}','dueDate',this.value)">
       </div>
     </div>
     <div class="f-row">
       <div>
         <div class="f-label">Column</div>
         <select class="f-input" onchange="handleColChange('${taskId}',this.value)">${colOpts}</select>
       </div>
       <div>
         <div class="f-label">Project</div>
         <select class="f-input" onchange="handleProjChange('${taskId}',this.value)">${projOpts}</select>
       </div>
     </div>
     <div>
       <div class="f-label">Subtasks <span class="f-hint">— also editable right on the board</span></div>
       <div class="sub-list" id="sub-list-${taskId}">${subHtml}</div>
       <button class="add-sub-btn" onclick="addSub('${taskId}')">+ add subtask</button>
     </div>
     <div>
       <div class="f-label">Labels</div>
       <div class="label-group">${lblBtns}</div>
     </div>
     <div class="meta-text">Created ${fmtFull(t.createdAt)}</div>`;

  document.getElementById('modal-foot').innerHTML =
    `<button class="btn btn-danger"
       onclick="if(confirm('Delete this task?'))deleteTask('${taskId}')">Delete</button>
     <button class="btn btn-primary" onclick="closeModal()">Done</button>`;
}

window.patchField = function (taskId, field, value) {
  const p = activeProj(); const t = p?.tasks?.[taskId]; if (!t) return;
  t[field] = value; save(); renderStats(); renderBoard();
};
window.setPri = function (taskId, pri) {
  const p = activeProj(); const t = p?.tasks?.[taskId]; if (!t) return;
  t.priority = pri; save(); renderBoard(); renderModal(taskId);
};
window.toggleLabel = function (taskId, label) {
  const p = activeProj(); const t = p?.tasks?.[taskId]; if (!t) return;
  t.labels = t.labels||[];
  const i = t.labels.indexOf(label);
  if (i>=0) t.labels.splice(i,1); else t.labels.push(label);
  save(); renderBoard(); renderModal(taskId);
};
window.handleColChange = function (taskId, newCol) {
  const p = activeProj(); const t = p?.tasks?.[taskId]; if (!t || t.column===newCol) return;
  moveTask(taskId, t.column, newCol);
};
window.handleProjChange = function (taskId, pid) {
  if (pid !== activeProject) moveTaskToProject(taskId, pid);
};

/* ──────── SUBTASK OPS (modal) ──────── */
window.addSub = function (taskId) {
  const p = activeProj(); const t = p?.tasks?.[taskId]; if (!t) return;
  t.subtasks = t.subtasks||[];
  t.subtasks.push({ id:uid(), title:'', done:false });
  expandedSubs.add(taskId);
  save(); renderModal(taskId);
  setTimeout(() => {
    const rows = document.querySelectorAll(`#sub-list-${taskId} .mtitle`);
    if (rows.length) rows[rows.length-1].focus();
  }, 30);
};
window.toggleSub = function (taskId, subId) { toggleSubInline(taskId, subId); };
window.patchSub  = function (taskId, subId, value) { patchSubInline(taskId, subId, value); };
window.deleteSub = function (taskId, subId) { deleteSubInline(taskId, subId); };

/* ══════════════ SCHEDULE / SHIFT CALENDAR ══════════════ */

/* date + time helpers */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromYMD(s){ return new Date(s+'T00:00:00'); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }  /* Monday start */
function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function toMin(t){ if(!t) return 0; const p=String(t).split(':'); return (+p[0])*60+(+p[1]||0); }
function fmtT(t){ const m=toMin(t); let h=Math.floor(m/60); const mm=m%60, ap=h>=12?'p':'a'; h=h%12||12; return h+(mm?':'+String(mm).padStart(2,'0'):'')+ap; }
function fmtRangeT(a,b){ return fmtT(a)+'–'+fmtT(b); }
function person(id){ return PEOPLE.find(p=>p.id===id)||PEOPLE[0]; }
function stype(id){ return SHIFT_TYPES.find(t=>t.id===id)||SHIFT_TYPES[SHIFT_TYPES.length-1]; }
function whoName(w){ return w==='both' ? PEOPLE[0].name+' + '+PEOPLE[1].name : person(w).name; }
function hexA(hex,a){ const c=hex.replace('#',''); return 'rgba('+parseInt(c.slice(0,2),16)+','+parseInt(c.slice(2,4),16)+','+parseInt(c.slice(4,6),16)+','+a+')'; }
function chipCss(w){
  if (w==='both') return 'background:linear-gradient(135deg,'+hexA(PEOPLE[0].color,.13)+' 50%,'+hexA(PEOPLE[1].color,.13)+' 50%);border-left:3px solid '+PEOPLE[2].color+';';
  const c=person(w).color;
  return 'background:'+hexA(c,.11)+';border-left:3px solid '+c+';';
}
function libFor(d){ return LIB_HOURS[d.getDay()]||null; }
function libLabel(d){ const L=libFor(d); return L?fmtRangeT(L.open,L.close):'closed'; }
function shiftsOn(ds){
  return Object.values(shifts).filter(s=>s&&s.date===ds)
    .sort((a,b)=>toMin(a.start)-toMin(b.start)||toMin(a.end)-toMin(b.end));
}

/* nav + toolbar */
function calLabel(){
  if (calView==='month') return calAnchor.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const s=startOfWeek(calAnchor), e=addDays(s,6);
  return s.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+e.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
window.toggleCal = function(){
  calCollapsed=!calCollapsed;
  store.set('cal-collapsed',calCollapsed?'1':'0');
  renderCal();
};
window.setCalView = function(v){
  calView=v; store.set('cal-view',v);
  if (calCollapsed){ calCollapsed=false; store.set('cal-collapsed','0'); }
  renderCal();
};
window.calShift = function(dir){
  calAnchor = calView==='month'
    ? new Date(calAnchor.getFullYear(), calAnchor.getMonth()+dir, 1)
    : addDays(calAnchor, 7*dir);
  renderCal();
};
window.calToday = function(){ calAnchor=new Date(); renderCal(); };

function renderCal(){
  const sec=document.getElementById('calsec'); if(!sec) return;
  sec.classList.toggle('collapsed', calCollapsed);
  const lbl=document.getElementById('cal-label'); if(lbl) lbl.textContent=calLabel();
  document.querySelectorAll('.cal-viewbtn').forEach(b=>b.classList.toggle('on', b.dataset.v===calView));
  const body=document.getElementById('cal-body'); if(!body) return;
  if (calCollapsed){ body.innerHTML=''; return; }
  if (calView==='hours')      body.innerHTML=calHoursHTML();
  else if (calView==='month') body.innerHTML=calMonthHTML();
  else                        body.innerHTML=calWeekHTML();
  /* nudge horizontal scroll so today is in view */
  if (calView==='week'){
    const g=body.querySelector('.wk-grid'), t=g&&g.querySelector('.wk-day.today');
    if (g&&t&&g.scrollWidth>g.clientWidth+8) g.scrollLeft=Math.max(0,t.offsetLeft-(g.clientWidth-t.offsetWidth)/2);
  }
  if (calView==='hours'){
    const w=body.querySelector('.hr-wrap'), th=body.querySelector('.hr-dayhead.today');
    if (w&&th&&w.scrollWidth>w.clientWidth+8) w.scrollLeft=Math.max(0,th.offsetLeft-70);
  }
}

/* easy week */
function calWeekHTML(){
  const s=startOfWeek(calAnchor), today=new Date();
  let cols='';
  for (let i=0;i<7;i++){
    const d=addDays(s,i), ds=ymd(d), isT=sameDay(d,today);
    const chips=shiftsOn(ds).map(sh=>{
      const ty=stype(sh.type);
      return `<button class="wk-chip" style="${chipCss(sh.who)}"
        onclick="openShiftModal('${sh.id}')"
        title="${esc(ty.label)} — ${esc(whoName(sh.who))}${sh.note?' · '+esc(sh.note):''}">
        <span class="wk-time">${fmtRangeT(sh.start,sh.end)}</span>
        <span class="wk-who">${ty.icon} ${esc(whoName(sh.who))}</span>
      </button>`;
    }).join('');
    cols+=`<div class="wk-day${isT?' today':''}">
      <div class="wk-head">
        <span class="wk-dow">${d.toLocaleDateString('en-US',{weekday:'short'})}</span>
        <span class="wk-num${isT?' t':''}">${d.getDate()}</span>
        <span class="wk-lib" title="SF Main Library hours">${libLabel(d)}</span>
      </div>
      <div class="wk-chips">${chips}</div>
      <button class="wk-add" title="Add a shift on ${ds}" onclick="openShiftModal(null,'${ds}')">+</button>
    </div>`;
  }
  return `<div class="wk-grid">${cols}</div>`;
}

/* full-hours week */
function calHoursHTML(){
  const s=startOfWeek(calAnchor), today=new Date();
  const gridH=(DAY_END-DAY_START)/60*HOUR_PX;
  let gut='';
  for (let m=DAY_START;m<DAY_END;m+=60){
    gut+=`<div class="hr-lbl" style="top:${(m-DAY_START)/60*HOUR_PX+2}px">${fmtT(String(Math.floor(m/60)).padStart(2,'0')+':00')}</div>`;
  }
  let heads='<div class="hr-corner"></div>', cols='';
  for (let i=0;i<7;i++){
    const d=addDays(s,i), ds=ymd(d), isT=sameDay(d,today);
    heads+=`<div class="hr-dayhead${isT?' today':''}">
      <span class="wk-dow">${d.toLocaleDateString('en-US',{weekday:'short'})}</span>
      <span class="wk-num${isT?' t':''}">${d.getDate()}</span>
      <span class="wk-lib">${libLabel(d)}</span>
    </div>`;
    const L=libFor(d);
    const closed = L
      ? `<div class="hr-closed" style="top:0;height:${(toMin(L.open)-DAY_START)/60*HOUR_PX}px"></div>
         <div class="hr-closed" style="top:${(toMin(L.close)-DAY_START)/60*HOUR_PX}px;height:${(DAY_END-toMin(L.close))/60*HOUR_PX}px"></div>`
      : `<div class="hr-closed" style="top:0;height:${gridH}px"></div>`;
    const blocks=shiftsOn(ds).map(sh=>{
      const top=Math.max(0,(toMin(sh.start)-DAY_START)/60*HOUR_PX);
      const h=Math.max(16,(toMin(sh.end)-toMin(sh.start))/60*HOUR_PX-2);
      const ty=stype(sh.type);
      return `<button class="hr-shift" style="top:${top}px;height:${h}px;${chipCss(sh.who)}"
        onclick="event.stopPropagation();openShiftModal('${sh.id}')"
        title="${esc(ty.label)} — ${esc(whoName(sh.who))}${sh.note?' · '+esc(sh.note):''}">
        <span class="hs-1">${ty.icon} ${esc(whoName(sh.who))}</span>
        <span class="hs-2">${fmtRangeT(sh.start,sh.end)}</span>
      </button>`;
    }).join('');
    let now='';
    if (isT){
      const nm=today.getHours()*60+today.getMinutes();
      if (nm>=DAY_START&&nm<=DAY_END) now=`<div class="hr-now" style="top:${(nm-DAY_START)/60*HOUR_PX}px"></div>`;
    }
    cols+=`<div class="hr-col" onclick="hrColClick(event,'${ds}')" title="Click an empty hour to add a shift">${closed}${blocks}${now}</div>`;
  }
  return `<div class="hr-wrap"><div class="hr-min">
    <div class="hr-scroll">
      <div class="hr-heads">${heads}</div>
      <div class="hr-grid" style="height:${gridH}px">
        <div class="hr-gutter">${gut}</div>${cols}
      </div>
    </div>
  </div></div>`;
}
window.hrColClick = function(e,ds){
  if (e.target.closest('.hr-shift')) return;
  const rect=e.currentTarget.getBoundingClientRect();
  let m=DAY_START+Math.floor((e.clientY-rect.top)/HOUR_PX)*60;
  m=Math.min(Math.max(m,DAY_START),DAY_END-60);
  const hh=String(Math.floor(m/60)).padStart(2,'0')+':00';
  const eh=String(Math.floor(m/60)+1).padStart(2,'0')+':00';
  openShiftModal(null,ds,hh,eh);
};

/* month */
function calMonthHTML(){
  const y=calAnchor.getFullYear(), mo=calAnchor.getMonth();
  const gridStart=startOfWeek(new Date(y,mo,1));
  const last=new Date(y,mo+1,0);
  const weeks=Math.ceil((Math.round((last-gridStart)/86400000)+1)/7);
  const today=new Date();
  const head=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="mo-dow">${x}</div>`).join('');
  let cells='';
  for (let i=0;i<weeks*7;i++){
    const d=addDays(gridStart,i), ds=ymd(d);
    const out=d.getMonth()!==mo, isT=sameDay(d,today);
    const list=shiftsOn(ds);
    const chips=list.slice(0,3).map(sh=>{
      const ty=stype(sh.type);
      return `<button class="mo-chip" style="${chipCss(sh.who)}"
        onclick="event.stopPropagation();openShiftModal('${sh.id}')"
        title="${fmtRangeT(sh.start,sh.end)} · ${esc(ty.label)} — ${esc(whoName(sh.who))}">
        <span class="ico">${ty.icon}</span><span class="t">${fmtT(sh.start)} ${esc(whoName(sh.who))}</span>
      </button>`;
    }).join('');
    const more=list.length>3?`<span class="mo-more">+${list.length-3}</span>`:'';
    cells+=`<div class="mo-cell${out?' out':''}" onclick="openShiftModal(null,'${ds}')" title="Add a shift on ${ds}">
      <span class="mo-num${isT?' t':''}">${d.getDate()}</span>${chips}${more}
    </div>`;
  }
  return `<div class="mo-grid"><div class="mo-head">${head}</div><div class="mo-cells">${cells}</div></div>`;
}

/* ──────── SHIFT MODAL ──────── */
window.openShiftModal = function (id, dateStr, start, end) {
  if (id && shifts[id]) {
    shiftDraft = { ...shifts[id] };
  } else {
    const ds = dateStr || ymd(new Date());
    const L = libFor(fromYMD(ds));
    shiftDraft = {
      id:null, date:ds,
      start: start || (L ? L.open  : '09:00'),
      end:   end   || (L ? L.close : '17:00'),
      who: store.get('lastWho') || 'leah',
      type:'library', note:'', repeat:'0',
    };
  }
  renderShiftModal();
  document.getElementById('shift-backdrop').style.display = 'flex';
};
window.closeShiftModal = function () {
  document.getElementById('shift-backdrop').style.display = 'none';
  shiftDraft = null;
};
window.shiftBackdropClick = function (e) { if (e.target.id === 'shift-backdrop') closeShiftModal(); };

function renderShiftModal(){
  const d=shiftDraft; if(!d) return;
  const editing=!!d.id;
  const dotColor = d.who==='both' ? PEOPLE[2].color : person(d.who).color;
  document.getElementById('shift-eyebrow').innerHTML =
    `<div style="width:7px;height:7px;border-radius:50%;background:${dotColor}"></div>${editing?'Edit shift':'New shift'}`;

  const whoBtns=PEOPLE.map(p=>
    `<button class="pri-btn${d.who===p.id?' on':''}"
       style="${d.who===p.id?`background:${p.color};border-color:${p.color};`:''}"
       onclick="shiftSet('who','${p.id}')">
       <span class="d" style="background:${d.who===p.id?'#fff':p.color}"></span>${p.name}</button>`
  ).join('');

  const typeBtns=SHIFT_TYPES.map(t=>
    `<button class="lbl-btn${d.type===t.id?' on':''}" onclick="shiftSet('type','${t.id}')">${t.icon} ${t.label}</button>`
  ).join('');

  const L=libFor(fromYMD(d.date));
  const reps=[['0','Just this day'],['1','This week + next'],['3','Weekly × 4'],['7','Weekly × 8'],['11','Weekly × 12']];

  document.getElementById('shift-body').innerHTML =
    `<div class="f-row">
       <div>
         <div class="f-label">Date</div>
         <input class="f-input" type="date" value="${d.date}" onchange="shiftSet('date',this.value)">
       </div>
       <div>
         <div class="f-label">Start / End</div>
         <div style="display:flex;gap:6px">
           <input class="f-input" type="time" value="${d.start}" onchange="shiftSet('start',this.value)">
           <input class="f-input" type="time" value="${d.end}" onchange="shiftSet('end',this.value)">
         </div>
       </div>
     </div>
     <div>
       <div class="f-label">Who</div>
       <div class="pri-group">${whoBtns}</div>
     </div>
     <div>
       <div class="f-label">Type</div>
       <div class="label-group">${typeBtns}</div>
     </div>
     <div class="preset-row">
       <button class="preset" onclick="presetLib()">☕ Library open–close${L?` (${fmtRangeT(L.open,L.close)})`:''}</button>
       <button class="preset" onclick="presetPastry()">🥐 8am pastry run</button>
     </div>
     <div>
       <div class="f-label">Note</div>
       <input class="f-input" value="${esc(d.note||'')}" placeholder="e.g. bring the float · order # · door code"
         oninput="shiftNote(this.value)">
     </div>
     ${editing?'':`<div>
       <div class="f-label">Repeat</div>
       <select class="f-input" onchange="shiftRepeat(this.value)">
         ${reps.map(([v,l])=>`<option value="${v}"${String(d.repeat)===v?' selected':''}>${l}</option>`).join('')}
       </select>
     </div>`}
     <div class="meta-text">Library that day: ${L?fmtRangeT(L.open,L.close):'closed'} — hours shaded on the grid. Holiday closures aren't tracked, so double-check big holidays.</div>`;

  document.getElementById('shift-foot').innerHTML =
    (editing
      ? `<div class="foot-group">
           <button class="btn btn-danger" onclick="deleteShift('${d.id}')">Delete</button>
           <button class="btn btn-ghost" title="Copy this shift to the same day next week" onclick="dupNextWeek('${d.id}')">→ next wk</button>
           <a class="btn btn-ghost" style="text-decoration:none;display:inline-flex;align-items:center"
             target="_blank" rel="noopener" title="Add this shift to a Google Calendar" href="${gcalURL(d)}">GCal ↗</a>
         </div>`
      : `<span class="meta-text">Shows for everyone on the board</span>`)
    + `<button class="btn btn-primary" onclick="saveShift()">${editing?'Save':'Add shift'}</button>`;
}

window.shiftSet    = function(f,v){ if(!shiftDraft) return; shiftDraft[f]=v; renderShiftModal(); };
window.shiftNote   = function(v){ if(shiftDraft) shiftDraft.note=v; };
window.shiftRepeat = function(v){ if(shiftDraft) shiftDraft.repeat=v; };
window.presetLib = function(){
  if(!shiftDraft) return;
  const L=libFor(fromYMD(shiftDraft.date));
  shiftDraft.type='library';
  if (L){ shiftDraft.start=L.open; shiftDraft.end=L.close; }
  renderShiftModal();
};
window.presetPastry = function(){
  if(!shiftDraft) return;
  shiftDraft.type='pastry'; shiftDraft.start='08:00'; shiftDraft.end='08:30';
  renderShiftModal();
};

window.saveShift = function(){
  const d=shiftDraft; if(!d) return;
  if(!d.date){ alert('Pick a date first.'); return; }
  if(toMin(d.end)<=toMin(d.start)){ alert('End time needs to be after start time.'); return; }
  store.set('lastWho', d.who);
  const reps = d.id ? 0 : (parseInt(d.repeat||'0',10)||0);
  const base={...d}; delete base.repeat;
  if(!base.id) base.id=uid();
  base.createdAt = base.createdAt || new Date().toISOString();
  shifts[base.id]=base;
  for(let k=1;k<=reps;k++){
    const c={...base, id:uid(), date:ymd(addDays(fromYMD(base.date),7*k))};
    shifts[c.id]=c;
  }
  saveShifts(); closeShiftModal(); renderCal();
};
window.deleteShift = function(id){
  if(!confirm('Delete this shift?')) return;
  delete shifts[id];
  saveShifts(); closeShiftModal(); renderCal();
};
window.dupNextWeek = function(id){
  const s=shifts[id]; if(!s) return;
  const c={...s, id:uid(), date:ymd(addDays(fromYMD(s.date),7))};
  shifts[c.id]=c;
  saveShifts(); closeShiftModal(); renderCal();
};

/* google calendar hand-offs */
function gcalURL(s){
  const ds=s.date.replace(/-/g,'');
  const ty=stype(s.type);
  const p=new URLSearchParams({
    action:'TEMPLATE',
    text:`${ty.icon} ${ty.label} — ${whoName(s.who)}`,
    dates:`${ds}T${s.start.replace(':','')}00/${ds}T${s.end.replace(':','')}00`,
    details:(s.note?s.note+'\n':'')+'From the Gratified ops board',
    location:s.type==='library'?LIB_LOC:'',
  });
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}
function escICS(s){ return String(s).replace(/\\/g,'\\\\').replace(/([,;])/g,'\\$1').replace(/\n/g,'\\n'); }
window.exportICS = function(){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gratified//ops//EN'];
  Object.values(shifts).forEach(s=>{
    if(!s||!s.date) return;
    const ds=s.date.replace(/-/g,''), ty=stype(s.type);
    lines.push('BEGIN:VEVENT',
      'UID:'+s.id+'@gratified',
      'DTSTAMP:'+stamp,
      'DTSTART:'+ds+'T'+s.start.replace(':','')+'00',
      'DTEND:'+ds+'T'+s.end.replace(':','')+'00',
      'SUMMARY:'+escICS(ty.icon+' '+ty.label+' — '+whoName(s.who)));
    if (s.note) lines.push('DESCRIPTION:'+escICS(s.note));
    if (s.type==='library') lines.push('LOCATION:'+escICS(LIB_LOC));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='gratified-shifts.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};

/* ──────── GATE (cover password) ──────── */
function gateVisible() { return document.getElementById('gate').style.display !== 'none'; }
function revealApp() {
  document.getElementById('gate').style.display = 'none';
  if (!syncStarted) { syncStarted = true; startSync(); }
}
window.submitGate = function () {
  const inp = document.getElementById('gate-input');
  const err = document.getElementById('gate-err');
  const v = (inp.value||'').trim().toLowerCase();
  if (v === GATE_WORD) { store.set('gate-ok', '1'); revealApp(); }
  else {
    err.textContent = 'Nope, try again.';
    inp.classList.remove('err'); void inp.offsetWidth; inp.classList.add('err');
    inp.value = ''; inp.focus();
  }
};
window.lockApp = function () { store.del('gate-ok'); location.reload(); };
function checkGate() {
  if (store.get('gate-ok') === '1') { revealApp(); }
  else { setTimeout(() => document.getElementById('gate-input')?.focus(), 60); }
}

/* ──────── KEYBOARD SHORTCUTS ──────── */
document.addEventListener('keydown', e => {
  if (gateVisible()) return;
  const tag = (document.activeElement?.tagName||'').toLowerCase();
  const typing = tag==='input' || tag==='textarea' || document.activeElement?.isContentEditable;
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); document.getElementById('search')?.focus(); }
  if (e.key === 'c') {
    e.preventDefault();
    const el = document.querySelector(`[data-fkey="quick:${activeMobileCol}"]`) ||
               document.querySelector('.quick-add');
    el?.focus();
  }
  if (e.key === 's') { e.preventDefault(); openShiftModal(null); }
  if (e.key === 'Escape') { closeModal(); closeProjSettings(); closeShiftModal(); }
});

/* ──────── INIT ──────── */
populateLabelSel();
attachProjbarDnD();
renderCal();
checkGate();
</script>
